<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windy Portfolio Screen</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #0f1115;
            color: #f8f8f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .wrap {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.6rem;
            letter-spacing: 0.04em;
        }

        p {
            margin: 0;
            color: #b8c0cc;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div>
            <h1>Windy Portfolio</h1>
            <p>3D portfolio scene is running.</p>
        </div>
    </div>
</body>
</html>
